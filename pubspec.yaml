name: word_search
description: "A premium word search puzzle game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
